<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teilen-Diagnose</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#fff;color:#111;line-height:1.4}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:6px 0}
  button{display:block;width:100%;padding:14px;margin:8px 0;font-size:16px;border:1px solid #888;border-radius:10px;background:#f2f2f2}
  button.primary{background:#0f766e;color:#fff;border-color:#0f766e}
  textarea{width:100%;height:340px;box-sizing:border-box;font:12px/1.35 monospace}
  .hint{color:#555;font-size:14px}
</style>
</head>
<body>
<h1>Teilen-Diagnose</h1>
<p class="hint">Bitte nacheinander jeden Button einmal antippen. Wenn die Teilen-Liste erscheint, kannst du sie wieder schließen. Am Ende den Bericht unten kopieren oder einen Screenshot davon schicken.</p>

<button class="primary" id="t-text">1. Nur Text teilen</button>
<button id="t-url">2. Nur Link teilen</button>
<button id="t-txt">3. Kleine Textdatei teilen</button>
<button id="t-jpg">4. Kleines Bild (JPEG) teilen</button>
<button id="t-pdf-small">5. Kleine PDF teilen</button>
<button id="t-pdf-big">6. Große PDF (ca. 700 KB) teilen</button>
<button id="t-pdf-notitle">7. Große PDF ohne Titel teilen</button>

<h2 style="font-size:16px">Bericht</h2>
<textarea id="out" readonly></textarea>
<button id="copy">Bericht kopieren</button>

<script>
const out = document.getElementById('out')
const log = (s) => {
  out.value += s + '\n'
  out.scrollTop = out.scrollHeight
}
const nowS = () => new Date().toLocaleTimeString('de-DE')

// ---------- Grunddaten ----------
async function basics() {
  log('Zeit: ' + new Date().toISOString())
  log('Browser: ' + navigator.userAgent)
  log('Installiert (standalone): ' + matchMedia('(display-mode: standalone)').matches)
  log('Sicherer Kontext: ' + window.isSecureContext)
  log('navigator.share vorhanden: ' + !!navigator.share)
  log('navigator.canShare vorhanden: ' + !!navigator.canShare)
  try {
    const pp = document.permissionsPolicy || document.featurePolicy
    if (pp && pp.allowsFeature) log('Permissions-Policy web-share erlaubt: ' + pp.allowsFeature('web-share'))
  } catch (e) { log('Permissions-Policy: Fehler ' + e.name) }
  try {
    const est = await navigator.storage.estimate()
    log('Speicher-Kontingent des Browsers (MB): ' + Math.round(est.quota / 1048576) + ', genutzt: ' + Math.round(est.usage / 1048576))
  } catch (e) { log('storage.estimate: Fehler ' + e.name) }
  try {
    const c = await caches.open('diag-test')
    await c.put('/diag', new Response(new Blob([new Uint8Array(1024 * 1024)])))
    await caches.delete('diag-test')
    log('Cache schreiben (1 MB): OK')
  } catch (e) { log('Cache schreiben: FEHLER ' + e.name + ': ' + e.message) }
  try {
    const root = await navigator.storage.getDirectory()
    const fh = await root.getFileHandle('diag.tmp', { create: true })
    const w = await fh.createWritable()
    await w.write(new Uint8Array(1024 * 1024))
    await w.close()
    await root.removeEntry('diag.tmp')
    log('Datei-Speicher (OPFS) schreiben: OK')
  } catch (e) { log('Datei-Speicher (OPFS): FEHLER ' + e.name + ': ' + e.message) }
  log('-----')
}

// ---------- Testdateien ----------
function pdfBlob(extraKB) {
  const head = '%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\n'
  const pad = extraKB ? '%' + 'A'.repeat(extraKB * 1024) + '\n' : ''
  const tail = 'trailer<</Root 1 0 R/Size 4>>\n%%EOF'
  return new Blob([head, pad, tail], { type: 'application/pdf' })
}
function jpgBlob() {
  const c = document.createElement('canvas')
  c.width = 300; c.height = 200
  const g = c.getContext('2d')
  g.fillStyle = '#0f766e'; g.fillRect(0, 0, 300, 200)
  g.fillStyle = '#fff'; g.font = '28px sans-serif'; g.fillText('Test', 110, 110)
  return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9))
}

// ---------- Ein Test ----------
async function run(label, data) {
  const t0 = performance.now()
  log(`[${nowS()}] ${label}`)
  log('  Aktivierung aktiv: ' + navigator.userActivation?.isActive)
  try {
    const can = navigator.canShare ? navigator.canShare(data) : 'n/a'
    log('  canShare: ' + can)
    await navigator.share(data)
    log('  => ERGEBNIS: OK (Teilen-Liste war offen) nach ' + Math.round(performance.now() - t0) + ' ms')
  } catch (e) {
    if (e.name === 'AbortError') log('  => ERGEBNIS: OK (Liste offen, abgebrochen)')
    else log('  => ERGEBNIS: FEHLER ' + e.name + ': ' + e.message + ' nach ' + Math.round(performance.now() - t0) + ' ms')
  }
}

const bind = (id, fn) => document.getElementById(id).addEventListener('click', fn)

bind('t-text', () => run('1. Text', { text: 'Test-Text aus der Diagnose' }))
bind('t-url', () => run('2. Link', { url: location.href }))
bind('t-txt', () => run('3. Textdatei', { files: [new File(['Testinhalt'], 'test.txt', { type: 'text/plain' })] }))
bind('t-jpg', async () => {
  const b = await jpgBlob() // schnell genug, Aktivierung bleibt erhalten
  run('4. JPEG (' + Math.round(b.size / 1024) + ' KB)', { files: [new File([b], 'test.jpg', { type: 'image/jpeg' })] })
})
bind('t-pdf-small', () => {
  const b = pdfBlob(0)
  run('5. Kleine PDF (' + b.size + ' Byte)', { files: [new File([b], 'test.pdf', { type: 'application/pdf' })] })
})
bind('t-pdf-big', () => {
  const b = pdfBlob(700)
  run('6. Große PDF (' + Math.round(b.size / 1024) + ' KB) mit Titel', { files: [new File([b], 'gross.pdf', { type: 'application/pdf' })], title: 'Test' })
})
bind('t-pdf-notitle', () => {
  const b = pdfBlob(700)
  run('7. Große PDF (' + Math.round(b.size / 1024) + ' KB) ohne Titel', { files: [new File([b], 'gross2.pdf', { type: 'application/pdf' })] })
})
bind('copy', async () => {
  try { await navigator.clipboard.writeText(out.value); alert('Kopiert.') }
  catch { out.select(); alert('Bitte den Text markieren und kopieren, oder einen Screenshot machen.') }
})

basics()
</script>
</body>
</html>
